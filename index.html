<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>پەیمانگای گەشە</title>
<style>
:root{--bg:#05080f;--s:#0b111b;--s2:#101927;--bd:#1a2a40;--a:#7dd3fc;--a2:#38bdf8;--t:#e8f2fc;--m:#8ba3bd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(56,189,248,.18),transparent),radial-gradient(700px 400px at 0% 100%,rgba(125,211,252,.08),transparent),var(--bg);color:var(--t);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(5,8,15,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.brand{font-weight:700;color:var(--a);font-size:19px}
.back{font:inherit;background:none;border:1px solid var(--bd);color:var(--a);border-radius:10px;padding:6px 14px;cursor:pointer}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.hero h1{font-size:30px;margin:10px 0 6px}.hero p{color:var(--m);margin:0;line-height:1.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tile{background:linear-gradient(160deg,var(--s2),var(--s));border:1px solid var(--bd);border-radius:18px;padding:16px 14px;text-align:right;color:var(--t);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:.2s}
.tile:hover{border-color:var(--a2);box-shadow:0 8px 30px rgba(56,189,248,.18);transform:translateY(-2px)}
.tile b{font-size:17px}.tile small{color:var(--m);font-size:13px;line-height:1.6}
.ic{font-size:26px;width:46px;height:46px;border-radius:12px;background:rgba(56,189,248,.12);display:grid;place-items:center}
.panel{background:linear-gradient(160deg,var(--s2),var(--s));border:1px solid var(--bd);border-radius:22px;padding:22px 18px;text-align:center}
h2{margin:6px 0;font-size:24px}
.sub{color:var(--m);line-height:1.8;margin:4px 0 14px;min-height:24px}
.muted{color:var(--m);font-size:14px;margin-top:12px;min-height:20px}
.btn{font:inherit;font-size:18px;border:0;border-radius:12px;padding:12px 22px;background:linear-gradient(135deg,var(--a),var(--a2));color:#04121e;font-weight:700;cursor:pointer;touch-action:manipulation;transition:transform .1s,left .18s,top .18s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--a);border:1px solid var(--bd)}
.chip{display:inline-block;background:rgba(56,189,248,.1);border:1px solid var(--bd);color:var(--a);border-radius:999px;padding:5px 12px;font-size:14px}
.stats,.meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px}
.fo{min-height:90px;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1.9}
.ball{font-size:72px;filter:drop-shadow(0 0 22px rgba(56,189,248,.7));animation:fl 3s ease-in-out infinite;cursor:pointer;display:inline-block}
@keyframes fl{50%{transform:translateY(-9px)}}
.slot{min-height:60px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
#b1.run{position:fixed;z-index:20}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}
.mc{aspect-ratio:1;border-radius:12px;border:1px solid var(--bd);background:var(--s);font-size:28px;cursor:pointer;color:var(--t);position:relative;padding:0}
.mc span{opacity:0;transition:.2s}
.mc::after{content:'?';position:absolute;inset:0;display:grid;place-items:center;color:var(--a2);font-size:22px;opacity:.6}
.mc.open,.mc.done{background:rgba(56,189,248,.14);border-color:var(--a2)}
.mc.open span,.mc.done span{opacity:1}.mc.open::after,.mc.done::after{opacity:0}
.rbox{height:200px;border-radius:16px;display:grid;place-items:center;font-size:20px;line-height:1.8;cursor:pointer;border:1px solid var(--bd);background:var(--s);margin:12px 0;padding:10px;user-select:none}
.rbox.wait{background:#0f1c2e;color:var(--m)}.rbox.go{background:var(--a2);color:#04121e;font-weight:700}.rbox.bad{background:#2a1218;color:#fca5a5}
input{font:inherit;font-size:20px;width:130px;text-align:center;direction:ltr;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--s);color:var(--t);margin-inline-end:8px}
input:focus{outline:2px solid var(--a2)}
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:10px auto 14px}
.xc{aspect-ratio:1;font-size:40px;border-radius:12px;border:1px solid var(--bd);background:var(--s);color:var(--a);cursor:pointer;font-family:Arial,sans-serif;padding:0}
.xc.o{color:#fff}
.opt{display:block;width:100%;margin:8px 0;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--s);color:var(--t);font:inherit;font-size:17px;cursor:pointer;text-align:right}
.opt.ok{background:rgba(34,197,94,.18);border-color:#22c55e}.opt.no{background:rgba(239,68,68,.18);border-color:#ef4444}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a2);transition:width .3s}
footer{text-align:center;color:var(--m);font-size:13px;margin-top:26px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:30}
.brand{display:flex;align-items:center;gap:10px}.brand span{line-height:1.3;font-size:16px}.brand small{display:block;color:var(--m);font-weight:400;font-size:12px}
.gc{position:static;inset:auto;pointer-events:auto;z-index:auto;width:min(100%,300px);aspect-ratio:1;border:1px solid var(--bd);border-radius:14px;background:var(--s);touch-action:none;display:block;margin:0 auto 12px}
.dp{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin:0 0 12px;direction:ltr}.dp button{font-size:20px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--s);color:var(--a);cursor:pointer}
.tbox{position:relative;height:260px;border:1px solid var(--bd);border-radius:16px;background:var(--s);margin:10px 0;overflow:hidden}
.dot{position:absolute;width:54px;height:54px;border-radius:50%;border:0;background:radial-gradient(circle,#fff,var(--a2));box-shadow:0 0 18px var(--a2);cursor:pointer;padding:0}
.ex{margin-top:12px;padding:12px;border-radius:12px;background:rgba(56,189,248,.08);border:1px solid var(--bd);line-height:1.8;text-align:right}

body{background-color:#04070d;background-image:linear-gradient(rgba(125,211,252,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(125,211,252,.045) 1px,transparent 1px);background-size:38px 38px}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(100px);pointer-events:none}
body::before{width:540px;height:540px;top:-180px;right:-140px;background:#0ea5e9;opacity:.42;animation:dr 18s ease-in-out infinite alternate}
body::after{width:480px;height:480px;bottom:-160px;left:-140px;background:#84cc16;opacity:.16;animation:dr 23s ease-in-out infinite alternate-reverse}
@keyframes dr{to{transform:translate(70px,60px) scale(1.18)}}
header{background:rgba(4,7,13,.78);border-bottom:1px solid rgba(125,211,252,.18)}
.brand img{height:44px;width:auto;border-radius:12px;background:#fff;box-shadow:0 0 18px rgba(56,189,248,.45)}
.brand span{font-size:18px;font-weight:800;background:linear-gradient(90deg,#e0f2fe,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{-webkit-text-fill-color:var(--m)}
.hero{text-align:center;padding:8px 0 2px}
.logo-card{display:inline-block;background:#fff;border-radius:28px;padding:12px 20px;box-shadow:0 0 0 1px rgba(255,255,255,.5),0 24px 70px rgba(14,165,233,.4);animation:fl 5s ease-in-out infinite}
.logo-card img{display:block;height:150px;width:auto}
.hero h1{font-size:36px;margin:20px 0 6px;background:linear-gradient(90deg,#e0f2fe,#38bdf8,#fde047);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--m);margin:0 0 12px}
.tile,.panel{border:1px solid transparent;background:linear-gradient(160deg,#0f1a2b,#0a111c) padding-box,linear-gradient(135deg,rgba(125,211,252,.6),rgba(56,189,248,.12) 45%,rgba(132,204,22,.35)) border-box;box-shadow:0 10px 36px rgba(0,0,0,.45)}
.tile{animation:up .55s both;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(220px 120px at 80% 0%,rgba(56,189,248,.18),transparent);opacity:0;transition:.3s}
.tile:hover::after{opacity:1}
.tile:nth-child(2){animation-delay:.05s}.tile:nth-child(3){animation-delay:.1s}.tile:nth-child(4){animation-delay:.15s}.tile:nth-child(5){animation-delay:.2s}.tile:nth-child(6){animation-delay:.25s}.tile:nth-child(7){animation-delay:.3s}.tile:nth-child(8){animation-delay:.35s}.tile:nth-child(9){animation-delay:.4s}.tile:nth-child(10){animation-delay:.45s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.ic{background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(132,204,22,.12));box-shadow:inset 0 0 0 1px rgba(125,211,252,.25)}
.btn{background:linear-gradient(135deg,#bae6fd,#38bdf8 55%,#0ea5e9);box-shadow:0 8px 24px rgba(14,165,233,.4)}
.btn.ghost{box-shadow:none;background:rgba(56,189,248,.06)}
h2{background:linear-gradient(90deg,#fff,#bae6fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.opt:hover{border-color:var(--a2);background:rgba(56,189,248,.08)}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--bd)}
.bl{position:absolute;bottom:-60px;font-size:46px;background:none;border:0;padding:0;cursor:pointer;animation:rise 4s linear forwards}
@keyframes rise{to{transform:translateY(-340px)}}
</style>
</head>

/* ---------- فاڵ ---------- */
function fortune(){
  const F=[["ئەمڕۆ ڕۆژێکی باش دەبێت؛ بە بزەیەکەوە دەست پێبکە.","ڕۆژ"],
  ["شتێکی خۆش لە ڕێگایە، تەنها کەمێک ئارام بگرە.","ڕۆژ"],
  ["کەمێک پشوو بدە و چایەک بخۆرەوە؛ دواتر کارەکانت ئاسانتر دەبن.","ڕۆژ"],
  ["تۆ لەوەی گومان دەبەیت زیرەکتریت.","ڕۆژ"],
  ["ئەگەر کۆدەکەت کاری نەکرد، دڵگران مەبە؛ هەموو پرۆگرامنووسێک ئەم ڕۆژانەی بینیوە.","کۆدکردن"],
  ["ئەمڕۆ هەڵەیەک لە پرۆگرامەکەت دەدۆزیتەوە و هاوپۆلەکانت سوپاست دەکەن.","کۆدکردن"],
  ["هاوڕێیەکت بیرت دەکاتەوە، پەیوەندیی پێوە بکە.","هاوڕێیەتی"],
  ["ئەمڕۆ هاوڕێیەکی نوێ لە پۆلەکەتدا پەیدا دەکەیت.","هاوڕێیەتی"],
  ["ئەگەر ئەمڕۆ بخوێنیت، سبەینێ نمرەیەکی باشت دەبێت.","خوێندن"],
  ["مامۆستاکەت ئەمڕۆ پرسیارێکت لێ دەکات و وەڵامەکەی دەزانیت.","خوێندن"]];
  const C=[["سوور","#ef4444"],["شین","#3b82f6"],["سەوز","#22c55e"],["زەرد","#facc15"],["مۆر","#8b5cf6"],["پرتەقاڵی","#f97316"],["پەمەیی","#ec4899"]];
  const T=["نەتگرتم!","نزیک بوویت، بەڵام نەتگرتم.","خێراتر بجووڵێ!","من کۆمپیوتەرم، لە تۆ خێراترم.","تەنها یەک هەوڵی تر ماوە!"];
  const MAX=5;let count=0,last=-1,seen=0,hit=0,typ,cur='';
  app.innerHTML=`<div class="panel"><div class="ball" id="ball">🔮</div><h2>فاڵی ئەمڕۆ</h2><p class="sub" id="sub">دەتوانیت دوگمەکە بگریت؟ هەوڵ بدە!</p><div class="fo" id="fo">✨</div><div class="meta" id="meta"></div><div class="slot"><button class="btn" id="b1">فاڵەکەم پیشان بدە</button><button class="btn" id="b2" hidden>فاڵێکی تر</button><button class="btn ghost" id="b3" hidden>ناردن بۆ هاوڕێیەک</button></div><div class="muted" id="cn"></div></div>`;
  const b1=$('#b1'),b2=$('#b2'),b3=$('#b3'),fo=$('#fo'),sub=$('#sub'),cn=$('#cn'),meta=$('#meta'),ball=$('#ball');
  function dodge(e){
    if(count>=MAX)return;const n=Date.now();if(n-hit<300)return;hit=n;
    if(e.preventDefault)e.preventDefault();count++;buzz(40);
    if(count<MAX){
      b1.classList.add('run');
      const w=innerWidth-b1.offsetWidth-16,h=innerHeight-b1.offsetHeight-16;
      b1.style.left=(8+Math.random()*Math.max(w,0))+'px';b1.style.top=(8+Math.random()*Math.max(h,0))+'px';
      b1.style.transform='scale('+(1-count*.06)+')';
      sub.textContent=T[count-1];cn.textContent='هەوڵی '+ar(count)+' لە '+ar(MAX);
    }else{
      b1.classList.remove('run');b1.style.left=b1.style.top=b1.style.transform='';
      b1.textContent='ئێستا کلیکم لێ بکە';sub.textContent='باشە، تەسلیم بووم!';cn.textContent='';
    }
  }
  b1.addEventListener('pointerenter',dodge);b1.addEventListener('pointerdown',dodge);
  function pick(){
    let i;do{i=rnd(F.length)}while(i===last);last=i;cur=F[i][0];seen++;
    const c=C[rnd(C.length)],a=Array.from(cur);let k=0;fo.textContent='';clearInterval(typ);
    typ=setInterval(()=>{fo.textContent+=a[k++];if(k>=a.length)clearInterval(typ)},32);
    meta.innerHTML=`<span class="chip">بەش: ${F[i][1]}</span><span class="chip">ژمارەی بەخت: ${ar(1+rnd(99))}</span><span class="chip">ڕەنگی بەخت: ${c[0]} <span style="color:${c[1]}">●</span></span>`;
    cn.textContent='ئەمڕۆ '+ar(seen)+' فاڵت بینیوە';confetti();buzz([50,30,50]);
  }
  b1.onclick=()=>{if(count<MAX)return;b1.hidden=true;b2.hidden=b3.hidden=false;sub.textContent='ئافەرین، بردتەوە!';pick()};
  b2.onclick=pick;
  ball.onclick=()=>buzz(30);
  b3.onclick=()=>{const t='فاڵی ئەمڕۆم: '+cur+'\n'+location.href;
    try{if(navigator.share){navigator.share({text:t});return}}catch(e){}
    try{navigator.clipboard.writeText(t);b3.textContent='کۆپی کرا ✓'}catch(e){b3.textContent='کۆپی نەکرا'}};
}

/* ---------- بیرهێنانەوە ---------- */
function memory(){
  const E=['💻','🖥️','⌨️','🖱️','💾','📡','🔌','🧠'],deck=sh([...E,...E]);
  let pk=[],moves=0,found=0,lock=false;const best=st.get('mem');
  app.innerHTML=`<div class="panel"><h2>یاری بیرهێنانەوە</h2><p class="sub">جووتە وێنەکان بدۆزەرەوە، بە کەمترین هەنگاو.</p><div class="stats"><span class="chip" id="m1">هەنگاو: ٠</span><span class="chip" id="m2">جووت: ٠ لە ٨</span><span class="chip" id="m3">باشترین: ${best?ar(best):'—'}</span></div><div class="mem">${deck.map((e,i)=>`<button class="mc" data-i="${i}"><span>${e}</span></button>`).join('')}</div><button class="btn ghost" id="rs">دەستپێکردنەوە</button><p class="sub" id="ms"></p></div>`;
  const cs=app.querySelectorAll('.mc');
  cs.forEach((c,i)=>c.onclick=()=>{
    if(lock||c.classList.contains('open')||c.classList.contains('done'))return;
    c.classList.add('open');pk.push(i);buzz(15);
    if(pk.length<2)return;
    moves++;$('#m1').textContent='هەنگاو: '+ar(moves);
    const[a,b]=pk;
    if(deck[a]===deck[b]){
      cs[a].className=cs[b].className='mc done';pk=[];found++;$('#m2').textContent='جووت: '+ar(found)+' لە ٨';
      if(found===8){
        $('#ms').textContent='ئافەرین! لە '+ar(moves)+' هەنگاودا تەواوت کرد.';confetti();

const sc={w:0,l:0,d:0};
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const win=b=>{for(const[x,y,z]of L)if(b[x]&&b[x]===b[y]&&b[x]===b[z])return b[x];return b.every(Boolean)?'d':null};
function ai(b){
  const f=p=>{for(const l of L){const v=l.map(i=>b[i]);if(v.filter(c=>c===p).length===2&&v.includes(''))return l[v.indexOf('')]}return -1};
  let m=f('O');if(m<0)m=f('X');if(m<0&&!b[4])m=4;
  if(m<0){const e=[0,2,6,8].filter(i=>!b[i]);if(e.length)m=e[rnd(e.length)]}
  if(m<0){const e=b.map((c,i)=>c?-1:i).filter(i=>i>=0);m=e[rnd(e.length)]}return m;
}
function xo(){
  const v=view;let b=Array(9).fill(''),over=false,turn=true;
  app.innerHTML=`<div class="panel"><h2>ئێکس و ئۆ</h2><p class="sub" id="xs">نۆرەی تۆیە، تۆ X ی.</p><div class="stats"><span class="chip" id="x1"></span></div><div class="xo">${b.map((_,i)=>`<button class="xc" data-i="${i}"></button>`).join('')}</div><button class="btn ghost" id="xr">یاری نوێ</button></div>`;
  const cs=app.querySelectorAll('.xc'),msg=t=>$('#xs').textContent=t;
  const tally=()=>$('#x1').textContent=`تۆ: ${ar(sc.w)} | کۆمپیوتەر: ${ar(sc.l)} | یەکسان: ${ar(sc.d)}`;tally();
  const draw=()=>cs.forEach((c,i)=>{c.textContent=b[i];c.classList.toggle('o',b[i]==='O')});
  function end(r){over=true;
    if(r==='X'){sc.w++;msg('تۆ بردتەوە!');confetti()}else if(r==='O'){sc.l++;msg('کۆمپیوتەر بردیەوە. دووبارە هەوڵ بدەوە!')}else{sc.d++;msg('یەکسان بوو.')}tally()}
  cs.forEach((c,i)=>c.onclick=()=>{
    if(over||!turn||b[i])return;b[i]='X';draw();let r=win(b);if(r)return end(r);
    turn=false;msg('کۆمپیوتەر بیر دەکاتەوە...');
    tm=setTimeout(()=>{if(v!==view)return;b[ai(b)]='O';draw();r=win(b);if(r)return end(r);turn=true;msg('نۆرەی تۆیە.')},500);
  });
  $('#xr').onclick=()=>go(xo);
}

const mk=(q,a,pool,e)=>[q,a,...sh([...new Set(pool)].filter(x=>x!==a)).slice(0,3),0,e].join('|');
function mathQs(){

  const add=(q,a,e)=>{const s=new Set([a]);while(s.size<4){const x=a+rnd(11)-5;if(x!==a)s.add(x)}o.push([q,...[...s].map(A),0,e].join('|'))};
  for(let r=0;r<5;r++){
    let a=R(2,9),b=R(2,3);add(`ئەنجامی ${L(A(a)+sup[b-2])} چەندە؟`,a**b,`${L(A(a)+sup[b-2]+' = '+Array(b).fill(A(a)).join(' × ')+' = '+A(a**b))}`);
    let q=R(2,15);add(`ڕەگی دووی ${A(q*q)} چەندە؟`,q,`چونکە ${L(A(q)+' × '+A(q)+' = '+A(q*q))}`);
    let x=R(1,12),m=R(2,6),c=R(1,15);add(`بەهای x لەم هاوکێشەیەدا چەندە؟ ${L(A(m)+'x + '+A(c)+' = '+A(m*x+c))}`,x,`${L(A(m*x+c)+' − '+A(c)+' = '+A(m*x))} ، دواتر ${L('÷ '+A(m)+' = '+A(x))}`);
    let p=[10,20,25,50][rnd(4)],n=20*R(1,10);add(`${A(p)}٪ی ${A(n)} چەندە؟`,n*p/100,`${L(A(n)+' × '+A(p)+' ÷ ١٠٠ = '+A(n*p/100))}`);
    let l=R(3,15),w=R(2,12);add(`ڕووبەری چوارگۆشەیەک بە درێژی ${A(l)} و پانی ${A(w)} چەندە؟`,l*w,`ڕووبەر = درێژی × پانی = ${L(A(l)+' × '+A(w)+' = '+A(l*w))}`);
    l=R(3,15);w=R(2,12);add(`دەوری چوارگۆشەیەک بە درێژی ${A(l)} و پانی ${A(w)} چەندە؟`,2*(l+w),`دەور = ٢ × (درێژی + پانی) = ${L('٢ × ('+A(l)+' + '+A(w)+') = '+A(2*(l+w)))}`);
    let u=R(10,40),v=R(10,40),z=R(10,40);z+=(3-(u+v+z)%3)%3;add(`تێکڕای ${A(u)} و ${A(v)} و ${A(z)} چەندە؟`,(u+v+z)/3,`کۆ = ${A(u+v+z)}، ئینجا ${L('÷ ٣ = '+A((u+v+z)/3))}`);
    let d1=R(2,9),d2=R(2,9),d3=R(2,9);add(`ئەنجامی ${L(A(d1)+' + '+A(d2)+' × '+A(d3))} چەندە؟`,d1+d2*d3,`سەرەتا لێکدان: ${L(A(d2)+' × '+A(d3)+' = '+A(d2*d3))}، پاشان کۆ لەگەڵ ${A(d1)} دەکەیتە ${A(d1+d2*d3)}`);
    let bs=2*R(2,10),ht=R(3,12);add(`ڕووبەری سێگۆشەیەک بە بنکەی ${A(bs)} و بەرزی ${A(ht)} چەندە؟`,bs*ht/2,`ڕووبەر = (بنکە × بەرزی) ÷ ٢ = ${L('('+A(bs)+' × '+A(ht)+') ÷ ٢ = '+A(bs*ht/2))}`);
    let e1=R(3,20),e2=R(1,15);add(`ئەنجامی ${L(A(e1)+' − (−'+A(e2)+')')} چەندە؟`,e1+e2,`کەمکردنەوەی ژمارەی نەرێنی وەک کۆکردنەوە وایە: ${L(A(e1)+' + '+A(e2)+' = '+A(e1+e2))}`);
  }
  return o;
}
function gen(i){
  if(i===3)return QB[3].concat(mathQs());
  const out=QB[i].slice();
  (SETS[i]||[]).forEach(([fq,rq,ex,ps])=>{const P=ps.split(';').map(s=>s.split('|'));
    P.forEach(p=>{const e=ex.replace('{t}',()=>p[0]).replace('{d}',()=>p[1]);
      out.push(mk(fq.replace('{t}',()=>p[0]),p[1],P.map(x=>x[1]),e));
      out.push(mk(rq.replace('{d}',()=>p[1]),p[0],P.map(x=>x[0]),e))})});
  return out;
}

function snake(){
  const v=view,N=15;let sn=[[7,7]],d=[1,0],nd=d,f=[3,3],sc=0;const best=+st.get('sn')||0;
  app.innerHTML=`<div class="panel"><h2>یاری مار</h2><p class="sub">بخۆ و گەورە ببە. بە دیوار و خۆت مەکەوە.</p><div class="stats"><span class="chip" id="s1">خاڵ: ٠</span><span class="chip">باشترین: ${ar(best)}</span></div><canvas class="gc" id="sc" width="300" height="300"></canvas><div class="dp"><i></i><button data-x="0" data-y="-1">▲</button><i></i><button data-x="-1" data-y="0">◀</button><button data-x="0" data-y="1">▼</button><button data-x="1" data-y="0">▶</button></div><p class="sub" id="sm"></p><button class="btn ghost" id="sr">دووبارە</button></div>`;
  const cv2=$('#sc'),c=cv2.getContext('2d');
  const dir=(x,y)=>{if(x+d[0]!==0||y+d[1]!==0)nd=[x,y]};
  app.querySelectorAll('.dp button').forEach(b=>b.onclick=()=>dir(+b.dataset.x,+b.dataset.y));
  document.onkeydown=e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m&&v===view){e.preventDefault();dir(...m)}};
  let sx,sy;cv2.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};
  cv2.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;Math.abs(dx)>Math.abs(dy)?dir(dx>0?1:-1,0):dir(0,dy>0?1:-1)};
  const has=(p,a)=>a.some(q=>q[0]===p[0]&&q[1]===p[1]);
  function draw(){c.clearRect(0,0,300,300);c.fillStyle='#fff';c.beginPath();c.arc(f[0]*20+10,f[1]*20+10,7,0,7);c.fill();
    sn.forEach((p,i)=>{c.fillStyle=i?'#38bdf8':'#bae6fd';c.fillRect(p[0]*20+1,p[1]*20+1,18,18)})}
  tm=setInterval(()=>{if(v!==view){clearInterval(tm);return}
    d=nd;const h=[sn[0][0]+d[0],sn[0][1]+d[1]];
    if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||has(h,sn)){clearInterval(tm);if(sc>best)st.set('sn',sc);$('#sm').textContent='یاری تەواو بوو. خاڵەکەت: '+ar(sc);buzz(200);return}
    sn.unshift(h);
    if(h[0]===f[0]&&h[1]===f[1]){sc++;$('#s1').textContent='خاڵ: '+ar(sc);do{f=[rnd(N),rnd(N)]}while(has(f,sn))}else sn.pop();
    draw()},130);
  draw();$('#sr').onclick=()=>go(snake);
}

function mathgame(){
  const v=view;let sc=0,t=30;const best=+st.get('mg')||0;
  app.innerHTML=`<div class="panel"><h2>بیرکاری خێرا</h2><p class="sub">٣٠ چرکەت هەیە، وەڵامی دروست هەڵبژێرە.</p><div class="stats"><span class="chip" id="q1">دروست: ٠</span><span class="chip" id="q2">کات: ٣٠</span><span class="chip">باشترین: ${ar(best)}</span></div><div id="qb"><button class="btn" id="qs">دەستپێکردن</button></div></div>`;
  function nq(){
    const a=1+rnd(12),b=1+rnd(12),op=rnd(3),r=[a+b,a-b,a*b][op],o=new Set([r]);while(o.size<4)o.add(r+rnd(11)-5);
    $('#qb').innerHTML=`<h2 style="direction:ltr;font-size:34px">${a} ${'+−×'[op]} ${b} = ?</h2><div class="grid">${sh([...o]).map(x=>`<button class="opt" data-x="${x}" style="text-align:center;direction:ltr">${x}</button>`).join('')}</div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.x===r){sc++;$('#q1').textContent='دروست: '+ar(sc);buzz(15)}else buzz(80);nq()});
  }
  $('#qs').onclick=()=>{nq();tm=setInterval(()=>{if(v!==view){clearInterval(tm);return}t--;$('#q2').textContent='کات: '+ar(t);
    if(t<=0){clearInterval(tm);if(sc>best)st.set('mg',sc);confetti();
      $('#qb').innerHTML=`<p class="sub" style="font-size:20px">کاتەکە تەواو بوو! ${ar(sc)} وەڵامی دروستت دا.</p><button class="btn ghost" id="qr">دووبارە</button>`;$('#qr').onclick=()=>go(mathgame)}},1000)};
}

function simon(){

  PN('خێرایی نووسین','ڕستەکە بە خێرایی و بێ هەڵە بنووسەوە.',ST(CH('c','باشترین: '+(o0?ar(o0)+' چرکە':'—')))+`<div id="s" style="font-size:20px;line-height:1.9;margin:10px;color:var(--a)"></div><input id="i" style="width:100%;direction:rtl;font-size:18px"><p class="sub" id="m" style="margin-top:12px"></p><button class="btn ghost" id="ag">ڕستەی تر</button>`);
  const nx=()=>{s=S[rnd(S.length)];set('s',s);$('#i').value='';t0=0;set('m','')};nx();
  $('#i').oninput=e=>{if(!t0)t0=performance.now();if(e.target.value===s){const sec=(performance.now()-t0)/1000;set('m','تەواو! '+ar(sec.toFixed(1))+' چرکە.');confetti();const o=bs('ty');if(!o||sec<o)st.set('ty',sec.toFixed(1));e.target.blur()}};
  $('#ag').onclick=nx;
}
function balloon(){
  const v=view;let sc=0,run=false,iv;
  PN('پەلەهەوا','هەر پەلەهەوایەک دەتەقێنیت یەک خاڵە. ٣٠ چرکەت هەیە.',TS('bl')+`<div class="tbox" id="tb"></div><button class="btn" id="go">دەستپێکردن</button>`);
  $('#go').onclick=()=>{if(run)return;run=true;sc=0;const tb=$('#tb');tb.innerHTML='';
    iv=setInterval(()=>{if(v!==view){clearInterval(iv);return}const b=document.createElement('button');b.className='bl';b.textContent='🎈';b.style.left=rnd(Math.max(tb.clientWidth-60,1))+'px';
      b.onpointerdown=()=>{if(b.dataset.x)return;b.dataset.x=1;b.textContent='💥';sc++;set('a','خاڵ: '+ar(sc));buzz(15);setTimeout(()=>b.remove(),150)};b.onanimationend=()=>b.remove();tb.appendChild(b)},550);
    tmr(v,30,t=>set('b','کات: '+ar(t)),()=>{clearInterval(iv);run=false;sv('bl',sc);tb.innerHTML='<p class="sub" style="padding-top:100px;text-align:center;font-size:20px">کاتەکە تەواو بوو! '+ar(sc)+' پەلەهەوات تەقاند.</p>';confetti()})};
}
function odd(){
  const v=view,P=[['😀','😃'],['🐶','🐕'],['🌑','🌚'],['🍎','🍏'],['⭐','🌟'],['😊','🙂'],['🔵','🟦']];let sc=0,run=false,bad=0;
  PN('جیاوازەکە بدۆزەرەوە','ئەو ئیمۆجییەی جیاوازە هەڵبژێرە. ٣٠ چرکەت هەیە.',TS('odd')+`<div class="xo" id="g"></div><button class="btn" id="go">دەستپێکردن</button>`);
  const nx=()=>{const n=Math.min(2+Math.floor(sc/3),6),[a,b]=P[rnd(P.length)],g=$('#g');bad=rnd(n*n);g.style.gridTemplateColumns=`repeat(${n},1fr)`;g.style.maxWidth='340px';
    g.innerHTML=Array.from({length:n*n},(_,i)=>`<button class="xc" data-i="${i}" style="font-size:${n>4?24:32}px">${i===bad?b:a}</button>`).join('');
    app.querySelectorAll('.xc').forEach(c=>c.onclick=()=>{if(!run)return;if(+c.dataset.i===bad){sc++;set('a','خاڵ: '+ar(sc));buzz(15)}else buzz(80);nx()})};
  $('#go').onclick=()=>{if(run)return;run=true;sc=0;nx();tmr(v,30,t=>set('b','کات: '+ar(t)),()=>{run=false;sv('odd',sc);$('#g').innerHTML='<p class="sub">کاتەکە تەواو بوو! '+ar(sc)+' جار دروستت دۆزییەوە.</p>';confetti()})};
}
function tf(){
  const v=view;let sc=0,run=false,ok=1;
  PN('ڕاستە یان هەڵە','٣٠ چرکەت هەیە؛ ئەنجامی هاوکێشەکە دروستە؟',TS('tf')+`<div id="q" style="font-size:40px;direction:ltr;margin:14px;font-weight:800;min-height:56px">؟</div><div class="slot"><button class="btn" id="y">ڕاستە ✓</button><button class="btn ghost" id="n">هەڵەیە ✗</button></div><p><button class="btn" id="go">دەستپێکردن</button></p>`);
  const nx=()=>{const a=1+rnd(20),b=1+rnd(20),op=rnd(3),r=[a+b,a-b,a*b][op];ok=rnd(2);set('q',`${a} ${'+−×'[op]} ${b} = ${ok?r:r+(rnd(2)?1:-1)*(1+rnd(3))}`)};
  const an=x=>{if(!run)return;if(x===ok){sc++;set('a','خاڵ: '+ar(sc));buzz(15)}else buzz(80);nx()};
  $('#y').onclick=()=>an(1);$('#n').onclick=()=>an(0);
  $('#go').onclick=()=>{if(run)return;run=true;sc=0;nx();tmr(v,30,t=>set('b','کات: '+ar(t)),()=>{run=false;sv('tf',sc);set('q','ئافەرین!');confetti()})};
}

/* ---------- confetti ---------- */
const cv=$('#cv'),cx=cv.getContext('2d');let P=[],on=false;
const fit=()=>{cv.width=innerWidth;cv.height=innerHeight};fit();addEventListener('resize',fit);
function confetti(){
  const col=['#7dd3fc','#38bdf8','#ffffff','#0ea5e9','#bae6fd'];
  for(let i=0;i<100;i++)P.push({x:cv.width/2,y:cv.height*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:4+Math.random()*5,c:col[i%5],a:Math.random()*6,l:100+Math.random()*60});
  if(!on){on=true;requestAnimationFrame(tick)}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.a+=.2;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
  if(P.length)requestAnimationFrame(tick);else{on=false;cx.clearRect(0,0,cv.width,cv.height)}
}
home();
})();
</script>
