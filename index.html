<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#04070d"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<title>پەیمانگای گەشە</title>
<style>
:root{--bg:#05080f;--s:#0b111b;--s2:#101927;--bd:#1a2a40;--a:#7dd3fc;--a2:#38bdf8;--t:#e8f2fc;--m:#8ba3bd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(56,189,248,.18),transparent),radial-gradient(700px 400px at 0% 100%,rgba(125,211,252,.08),transparent),var(--bg);color:var(--t);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(5,8,15,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.brand{font-weight:700;color:var(--a);font-size:19px}
.back{font:inherit;background:none;border:1px solid var(--bd);color:var(--a);border-radius:10px;padding:6px 14px;cursor:pointer}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.hero h1{font-size:30px;margin:10px 0 6px}.hero p{color:var(--m);margin:0;line-height:1.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.tile{background:linear-gradient(160deg,var(--s2),var(--s));border:1px solid var(--bd);border-radius:18px;padding:16px 14px;text-align:right;color:var(--t);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:.2s}
.tile:hover{border-color:var(--a2);box-shadow:0 8px 30px rgba(56,189,248,.18);transform:translateY(-2px)}
.tile b{font-size:17px}.tile small{color:var(--m);font-size:13px;line-height:1.6}
.ic{font-size:26px;width:46px;height:46px;border-radius:12px;background:rgba(56,189,248,.12);display:grid;place-items:center}
.panel{background:linear-gradient(160deg,var(--s2),var(--s));border:1px solid var(--bd);border-radius:22px;padding:22px 18px;text-align:center}
h2{margin:6px 0;font-size:24px}
.sub{color:var(--m);line-height:1.8;margin:4px 0 14px;min-height:24px}
.muted{color:var(--m);font-size:14px;margin-top:12px;min-height:20px}
.btn{font:inherit;font-size:18px;border:0;border-radius:12px;padding:12px 22px;background:linear-gradient(135deg,var(--a),var(--a2));color:#04121e;font-weight:700;cursor:pointer;touch-action:manipulation;transition:transform .1s,left .18s,top .18s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--a);border:1px solid var(--bd)}
.chip{display:inline-block;background:rgba(56,189,248,.1);border:1px solid var(--bd);color:var(--a);border-radius:999px;padding:5px 12px;font-size:14px}
.stats,.meta{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px}
.fo{min-height:90px;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1.9}
.ball{font-size:72px;filter:drop-shadow(0 0 22px rgba(56,189,248,.7));animation:fl 3s ease-in-out infinite;cursor:pointer;display:inline-block}
@keyframes fl{50%{transform:translateY(-9px)}}
.slot{min-height:60px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
#b1.run{position:fixed;z-index:20}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}
.mc{aspect-ratio:1;border-radius:12px;border:1px solid var(--bd);background:var(--s);font-size:28px;cursor:pointer;color:var(--t);position:relative;padding:0}
.mc span{opacity:0;transition:.2s}
.mc::after{content:'?';position:absolute;inset:0;display:grid;place-items:center;color:var(--a2);font-size:22px;opacity:.6}
.mc.open,.mc.done{background:rgba(56,189,248,.14);border-color:var(--a2)}
.mc.open span,.mc.done span{opacity:1}.mc.open::after,.mc.done::after{opacity:0}
.rbox{height:200px;border-radius:16px;display:grid;place-items:center;font-size:20px;line-height:1.8;cursor:pointer;border:1px solid var(--bd);background:var(--s);margin:12px 0;padding:10px;user-select:none}
.rbox.wait{background:#0f1c2e;color:var(--m)}.rbox.go{background:var(--a2);color:#04121e;font-weight:700}.rbox.bad{background:#2a1218;color:#fca5a5}
input{font:inherit;font-size:20px;width:130px;text-align:center;direction:ltr;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--s);color:var(--t);margin-inline-end:8px}
input:focus{outline:2px solid var(--a2)}
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:10px auto 14px}
.xc{aspect-ratio:1;font-size:40px;border-radius:12px;border:1px solid var(--bd);background:var(--s);color:var(--a);cursor:pointer;font-family:Arial,sans-serif;padding:0}
.xc.o{color:#fff}
.opt{display:block;width:100%;margin:8px 0;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--s);color:var(--t);font:inherit;font-size:17px;cursor:pointer;text-align:right}
.opt.ok{background:rgba(34,197,94,.18);border-color:#22c55e}.opt.no{background:rgba(239,68,68,.18);border-color:#ef4444}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a2);transition:width .3s}
footer{text-align:center;color:var(--m);font-size:13px;margin-top:26px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:30}
.brand{display:flex;align-items:center;gap:10px}.brand span{line-height:1.3;font-size:16px}.brand small{display:block;color:var(--m);font-weight:400;font-size:12px}
.gc{position:static;inset:auto;pointer-events:auto;z-index:auto;width:min(100%,300px);aspect-ratio:1;border:1px solid var(--bd);border-radius:14px;background:var(--s);touch-action:none;display:block;margin:0 auto 12px}
.dp{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin:0 0 12px;direction:ltr}.dp button{font-size:20px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--s);color:var(--a);cursor:pointer}
.tbox{position:relative;height:260px;border:1px solid var(--bd);border-radius:16px;background:var(--s);margin:10px 0;overflow:hidden}
.dot{position:absolute;width:54px;height:54px;border-radius:50%;border:0;background:radial-gradient(circle,#fff,var(--a2));box-shadow:0 0 18px var(--a2);cursor:pointer;padding:0}
.ex{margin-top:12px;padding:12px;border-radius:12px;background:rgba(56,189,248,.08);border:1px solid var(--bd);line-height:1.8;text-align:right}

body{background-color:#04070d;background-image:linear-gradient(rgba(125,211,252,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(125,211,252,.045) 1px,transparent 1px);background-size:38px 38px}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(100px);pointer-events:none}
body::before{width:540px;height:540px;top:-180px;right:-140px;background:#0ea5e9;opacity:.42;animation:dr 18s ease-in-out infinite alternate}
body::after{width:480px;height:480px;bottom:-160px;left:-140px;background:#84cc16;opacity:.16;animation:dr 23s ease-in-out infinite alternate-reverse}
@keyframes dr{to{transform:translate(70px,60px) scale(1.18)}}
header{background:rgba(4,7,13,.78);border-bottom:1px solid rgba(125,211,252,.18)}
.brand img{height:44px;width:auto;border-radius:12px;background:#fff;box-shadow:0 0 18px rgba(56,189,248,.45)}
.brand span{font-size:18px;font-weight:800;background:linear-gradient(90deg,#e0f2fe,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{-webkit-text-fill-color:var(--m)}
.hero{text-align:center;padding:8px 0 2px}
.logo-card{display:inline-block;background:#fff;border-radius:28px;padding:12px 20px;box-shadow:0 0 0 1px rgba(255,255,255,.5),0 24px 70px rgba(14,165,233,.4);animation:fl 5s ease-in-out infinite}
.logo-card img{display:block;height:150px;width:auto}
.hero h1{font-size:36px;margin:20px 0 6px;background:linear-gradient(90deg,#e0f2fe,#38bdf8,#fde047);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--m);margin:0 0 12px}
.tile,.panel{border:1px solid transparent;background:linear-gradient(160deg,#0f1a2b,#0a111c) padding-box,linear-gradient(135deg,rgba(125,211,252,.6),rgba(56,189,248,.12) 45%,rgba(132,204,22,.35)) border-box;box-shadow:0 10px 36px rgba(0,0,0,.45)}
.tile{animation:up .55s both;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(220px 120px at 80% 0%,rgba(56,189,248,.18),transparent);opacity:0;transition:.3s}
.tile:hover::after{opacity:1}
.tile:nth-child(2){animation-delay:.05s}.tile:nth-child(3){animation-delay:.1s}.tile:nth-child(4){animation-delay:.15s}.tile:nth-child(5){animation-delay:.2s}.tile:nth-child(6){animation-delay:.25s}.tile:nth-child(7){animation-delay:.3s}.tile:nth-child(8){animation-delay:.35s}.tile:nth-child(9){animation-delay:.4s}.tile:nth-child(10){animation-delay:.45s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.ic{background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(132,204,22,.12));box-shadow:inset 0 0 0 1px rgba(125,211,252,.25)}
.btn{background:linear-gradient(135deg,#bae6fd,#38bdf8 55%,#0ea5e9);box-shadow:0 8px 24px rgba(14,165,233,.4)}
.btn.ghost{box-shadow:none;background:rgba(56,189,248,.06)}
h2{background:linear-gradient(90deg,#fff,#bae6fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.opt:hover{border-color:var(--a2);background:rgba(56,189,248,.08)}
footer{margin-top:30px;padding-top:14px;border-top:1px solid var(--bd)}
.bl{position:absolute;bottom:-60px;font-size:46px;background:none;border:0;padding:0;cursor:pointer;animation:rise 4s linear forwards}
@keyframes rise{to{transform:translateY(-340px)}}
.g48{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px;margin:10px auto;padding:8px;background:var(--s);border-radius:14px;touch-action:none}
.t48{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:26px;background:var(--s2);direction:ltr;font-family:Arial,sans-serif}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:350px;margin:10px auto;padding:8px;background:#0e3a5c;border-radius:14px}
.c4 button{aspect-ratio:1;border-radius:50%;border:0;background:var(--bg);padding:0;cursor:pointer}
.c4 .p1{background:#38bdf8}.c4 .p2{background:#facc15}
.mn{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:340px;margin:10px auto;direction:ltr}
.mn button{aspect-ratio:1;border-radius:8px;border:1px solid var(--bd);background:var(--s2);color:var(--t);font-size:18px;font-weight:700;padding:0;font-family:Arial,sans-serif;cursor:pointer}
.mn button.o{background:rgba(56,189,248,.14)}

.ptw{position:fixed;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;z-index:5;background:radial-gradient(circle at 50% 35%,rgba(14,165,233,.16),transparent 65%),rgba(4,7,13,.93)}
.ptb{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;flex:none}
.ptb::-webkit-scrollbar{display:none}
.ptb button,.ptb select{font:inherit;font-size:14px;white-space:nowrap;flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--bd);background:rgba(56,189,248,.07);color:var(--a);cursor:pointer;display:inline-flex;align-items:center}
.ptb .on{background:var(--a2);color:#04121e;border-color:var(--a2);font-weight:700}
.ptb select{appearance:none;-webkit-appearance:none;padding-inline:16px}
.dt{width:9px;height:9px;border-radius:50%;margin-inline-end:7px;display:inline-block}
.ptsr{padding:0 12px 6px;flex:none}
.ptsr input{width:100%;direction:rtl;text-align:right;font-size:15px;border-radius:999px;padding:9px 18px;margin:0}
.stage{flex:1;position:relative;overflow:hidden;perspective:1600px;touch-action:none;cursor:grab;min-height:0}
.stage:active{cursor:grabbing}
.scene{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.el{position:absolute;left:50%;top:50%;width:68px;height:86px;margin:-43px 0 0 -34px;border-radius:9px;border:1px solid color-mix(in srgb,var(--c) 65%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,#0a111c),#0a111c 85%);box-shadow:0 0 16px color-mix(in srgb,var(--c) 28%,transparent);transition:transform 1.4s cubic-bezier(.2,.8,.2,1),opacity .35s,filter .35s,box-shadow .3s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;direction:ltr;user-select:none;-webkit-user-select:none;color:#fff;font-family:Arial,sans-serif}
.el i{position:absolute;top:4px;left:6px;font-style:normal;font-size:9px;color:var(--c)}
.el b{font-size:25px;line-height:1}
.el u{text-decoration:none;font-size:9px;color:#cfe6f7;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,Arial,sans-serif}
.el s{text-decoration:none;font-size:8px;color:var(--m)}
.el.dim{opacity:.08;filter:grayscale(1)}
.el.sel{box-shadow:0 0 0 2px #fff,0 0 34px var(--c)}
.pti{position:absolute;left:10px;right:10px;bottom:92px;max-width:470px;margin:0 auto;background:rgba(10,17,28,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:18px;padding:14px;display:flex;gap:14px;z-index:8;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.pti[hidden]{display:none}
.pti .x{position:absolute;top:6px;left:10px;background:none;border:0;color:var(--m);font-size:18px;cursor:pointer}
.pn{width:74px;height:92px;flex:none;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,#0a111c),#0a111c);direction:ltr;font-family:Arial,sans-serif;box-shadow:0 0 24px color-mix(in srgb,var(--c) 40%,transparent)}
.pn i{font-style:normal;font-size:12px;color:var(--c)}.pn b{font-size:32px}
.pd{flex:1;min-width:0}
.pd h3{margin:0;font-size:21px;color:#fff}
.pd .en{margin:2px 0 4px;color:var(--a);direction:ltr;text-align:right;font-family:Arial,sans-serif}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px;color:var(--m)}
.pg b{display:block;color:var(--t);font-size:14px;font-weight:600}
.ptc{padding-bottom:4px}
.pth{margin:0;padding:2px 12px 10px;font-size:12px;color:var(--m);text-align:center;flex:none}

/* ===== نوێکردنەوەی دیزاین و ئەنیمەیشن ===== */
html{scroll-behavior:smooth}
body{font-family:"Vazirmatn","Noto Naskh Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
::selection{background:rgba(56,189,248,.35);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#1c3350;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--a2);outline-offset:3px}
#bgc{z-index:-1}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#0b2236,#04070d 70%);animation:spf .7s ease .9s forwards;pointer-events:none}
#splash img{width:92px;height:auto;border-radius:22px;background:#fff;box-shadow:0 0 70px rgba(56,189,248,.65);animation:spz 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes spz{from{opacity:0;transform:scale(.55) rotate(-10deg)}60%{opacity:1;transform:scale(1.07) rotate(0)}to{transform:scale(1)}}
@keyframes spf{to{opacity:0;visibility:hidden}}
header{box-shadow:0 10px 34px rgba(0,0,0,.4);animation:hd .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes hd{from{transform:translateY(-100%);opacity:0}}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--a2),#84cc16,var(--a2),transparent);background-size:200% 100%;animation:ln 6s linear infinite}
@keyframes ln{to{background-position:200% 0}}
.brand img{animation:glow 3.6s ease-in-out infinite;transition:transform .4s}
.brand:hover img{transform:rotate(-6deg) scale(1.08)}
@keyframes glow{50%{box-shadow:0 0 30px rgba(56,189,248,.8)}}
.back{transition:.25s}.back:hover{background:rgba(56,189,248,.14);transform:translateX(3px)}
.hero{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.logo-card{position:relative;overflow:hidden}
.logo-card::after{content:"";position:absolute;top:0;bottom:0;width:55%;left:-80%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-20deg);animation:sw 5.5s ease-in-out infinite}
@keyframes sw{0%,55%{left:-80%}100%{left:140%}}
.hero h1{background:linear-gradient(90deg,#e0f2fe,#38bdf8,#fde047,#38bdf8,#e0f2fe);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.hero .stats .chip{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.hero .stats .chip:nth-child(2){animation-delay:.1s}.hero .stats .chip:nth-child(3){animation-delay:.2s}.hero .stats .chip:nth-child(4){animation-delay:.3s}
.sec{display:flex;align-items:center;gap:12px;margin:26px 0 4px;color:var(--a);font-weight:600;font-size:15px}
.sec::before,.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--bd),transparent)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
.panel{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.tile{transition:transform .25s ease,border-color .25s,box-shadow .3s;will-change:transform}
.tile::after{background:radial-gradient(220px circle at var(--mx,80%) var(--my,0%),rgba(56,189,248,.24),transparent 70%)}
.tile .ic{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tile:hover .ic{transform:scale(1.14) rotate(-7deg)}
.tile b{transition:color .25s}.tile:hover b{color:var(--a)}
.btn,.opt{position:relative;overflow:hidden;transition:transform .15s,box-shadow .25s,filter .25s,background .25s,border-color .25s}
.btn:hover{filter:brightness(1.08);box-shadow:0 12px 30px rgba(14,165,233,.5);transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn.ghost:hover{background:rgba(56,189,248,.14);box-shadow:none}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.38);transform:scale(0);animation:rpl .6s ease-out forwards;pointer-events:none}
@keyframes rpl{to{transform:scale(2.6);opacity:0}}
.chip{transition:.3s}
.chip.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.18);background:rgba(56,189,248,.28)}}
.opt:hover{transform:translateX(-3px)}
.opt.ok{animation:okp .5s}.opt.no{animation:nud .45s}
@keyframes okp{40%{transform:scale(1.03);box-shadow:0 0 24px rgba(34,197,94,.45)}}
@keyframes nud{20%{transform:translateX(8px)}40%{transform:translateX(-8px)}60%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
.bar i{background:linear-gradient(90deg,var(--a2),var(--a));box-shadow:0 0 14px var(--a2)}
.ex{animation:rise .4s both}
.mc.open,.mc.done{animation:flp .4s}
@keyframes flp{from{transform:rotateY(90deg)}to{transform:none}}
.xc,.mc{transition:transform .12s,background .25s,border-color .25s}.xc:active,.mc:active{transform:scale(.92)}
.rbox{transition:background .25s,transform .15s}.rbox:active{transform:scale(.985)}
.tbox,.g48,.c4,.mn,.xo{animation:rise .5s both}
.stage{background-image:radial-gradient(1.2px 1.2px at 12% 22%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 78% 15%,rgba(186,230,253,.8),transparent),radial-gradient(1.4px 1.4px at 35% 78%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 88% 66%,rgba(125,211,252,.8),transparent),radial-gradient(1px 1px at 55% 45%,rgba(255,255,255,.5),transparent),radial-gradient(1.2px 1.2px at 6% 85%,rgba(186,230,253,.7),transparent),radial-gradient(1px 1px at 66% 90%,rgba(255,255,255,.6),transparent)}
.ptw{animation:fadeIn .6s both}@keyframes fadeIn{from{opacity:0}}
.el:hover{filter:brightness(1.3);box-shadow:0 0 28px var(--c)}
.el.sel{animation:selp 1.6s ease-in-out infinite}
@keyframes selp{50%{box-shadow:0 0 0 2px #fff,0 0 52px var(--c)}}
.pti{animation:rise .35s both}
header.sc{background:rgba(4,7,13,.94)}
footer{opacity:.8}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}#bgc{display:none}}

.cats{display:grid;gap:14px;margin-top:14px}
.cat{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;text-align:right;color:var(--t);font:inherit;cursor:pointer;padding:20px 18px;border-radius:22px;border:1px solid transparent;background:linear-gradient(160deg,#101c2e,#0a111c) padding-box,linear-gradient(135deg,rgba(125,211,252,.7),rgba(56,189,248,.12) 50%,rgba(132,204,22,.4)) border-box;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:rise .6s cubic-bezier(.2,.8,.2,1) both;transition:transform .25s,box-shadow .3s}
.cat.c1{background:linear-gradient(160deg,#101c2e,#0a111c) padding-box,linear-gradient(135deg,rgba(253,224,71,.6),rgba(56,189,248,.12) 50%,rgba(132,204,22,.6)) border-box}
.cat::after{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx,85%) var(--my,0%),rgba(56,189,248,.22),transparent 70%);pointer-events:none}
.cat:hover{box-shadow:0 18px 50px rgba(14,165,233,.28)}
.ci{font-size:38px;width:72px;height:72px;flex:none;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(56,189,248,.28),rgba(132,204,22,.14));box-shadow:inset 0 0 0 1px rgba(125,211,252,.3),0 0 30px rgba(56,189,248,.25);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.cat:hover .ci{transform:scale(1.1) rotate(-7deg)}
.ct{flex:1;min-width:0}.ct b{display:block;font-size:22px;margin-bottom:2px}.ct small{color:var(--m);font-size:13px;line-height:1.7;display:block}
.cat em{font-style:normal;font-weight:800;font-size:15px;min-width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(56,189,248,.14);color:var(--a);border:1px solid var(--bd)}
.hero.hub{padding-top:2px}.hero.hub h1{font-size:30px;margin:8px 0 4px}
.hi{font-size:56px;line-height:1;filter:drop-shadow(0 0 22px rgba(56,189,248,.75));animation:fl 4s ease-in-out infinite;display:inline-block}

.cd{direction:ltr;background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:12px 16px;text-align:right;margin-bottom:12px}
.ce{min-height:24px;color:var(--m);font-size:18px;overflow-x:auto;white-space:nowrap;font-family:Arial,sans-serif}
.cr{font-size:36px;font-weight:800;color:var(--a);overflow-x:auto;font-family:Arial,sans-serif}
.ck{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;direction:ltr}
.ck button{padding:14px 0;border-radius:14px;border:1px solid var(--bd);background:var(--s2);color:var(--t);font-size:18px;font-family:Arial,sans-serif;cursor:pointer;transition:transform .1s,background .2s}
.ck button:active{transform:scale(.92)}.ck .o{color:var(--a)}
.ck .eq{background:linear-gradient(135deg,var(--a),var(--a2));color:#04121e;font-weight:800}
.rw{display:flex;gap:8px;margin:8px 0;align-items:center}
.rw input{flex:1;min-width:0;width:auto;text-align:right;direction:rtl;font-size:16px;margin:0;padding:10px}
.rw input[type=number],.rw input[type=time],.rw input[type=date]{direction:ltr;text-align:center}
.rw input.sm{flex:none;width:78px}
select.sl{font:inherit;font-size:15px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--s);color:var(--t);flex:1;min-width:0}
.rw .x,.li .x{background:none;border:0;color:#f87171;font-size:18px;cursor:pointer;flex:none}
.dtab{display:flex;gap:6px;overflow-x:auto;margin:6px 0 12px;padding-bottom:4px;scrollbar-width:none}
.dtab button{font:inherit;font-size:14px;white-space:nowrap;flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--bd);background:rgba(56,189,248,.07);color:var(--a);cursor:pointer}
.dtab .on{background:var(--a2);color:#04121e;border-color:var(--a2);font-weight:700}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--s);margin:8px 0;text-align:right}
.li>span:not(.ai):not(.tmx){flex:1;min-width:0}
.li.dn>span{text-decoration:line-through;opacity:.5}
.li input[type=checkbox]{width:20px;height:20px;margin:0;flex:none;accent-color:var(--a2)}
.li small{color:var(--m)}.li a{color:var(--a)}.li em{color:var(--m);font-style:normal}
.tmx{color:var(--a);font-weight:700;min-width:58px;direction:ltr}.ai{font-size:22px}
.uo{flex:1;display:block;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--s);font-size:20px;font-weight:700;color:var(--a);direction:ltr;text-align:center;overflow-x:auto}
.ua{font-size:22px;color:var(--m);margin:2px}
.big{font-size:20px;font-weight:700;color:var(--a);margin:14px 0;line-height:1.8}
.sh{margin:20px 0 6px;font-size:16px;color:var(--a);text-align:right}
.ring{position:relative;width:220px;height:220px;margin:14px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.rb{fill:none;stroke:var(--bd);stroke-width:8}
.rf{fill:none;stroke:var(--a2);stroke-width:8;stroke-linecap:round;stroke-dasharray:327;transition:stroke-dashoffset .5s linear;filter:drop-shadow(0 0 6px var(--a2))}
.rt{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:800;direction:ltr}
.gl{display:grid;grid-template-columns:1fr;gap:0;text-align:right}
.gi{padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--s);margin:6px 0}
.gi b{direction:ltr;display:block;text-align:left;font-family:Arial,sans-serif;color:var(--a)}.gi span{display:block}.gi i{display:block;font-style:normal;color:var(--m);direction:rtl}
.fc{perspective:900px;margin:16px auto;max-width:360px;height:220px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,1.2,.5,1);transform-style:preserve-3d}
.fc.f .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;padding:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:24px;line-height:1.7;border:1px solid var(--bd);background:linear-gradient(160deg,#10203a,#0a111c);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.fb{transform:rotateY(180deg);background:linear-gradient(160deg,#0f2d2a,#0a111c);color:var(--a)}
a.btn{display:inline-block;text-decoration:none}
.aip,.ail{text-align:right}
.aih{display:flex;gap:14px;align-items:center;margin-bottom:6px}.aih h2{margin:0}.aih p{margin:2px 0 0;color:var(--m);font-size:14px;line-height:1.7}
.aib{font-size:30px;width:58px;height:58px;flex:none;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(56,189,248,.3),rgba(253,224,71,.2));box-shadow:inset 0 0 0 1px rgba(125,211,252,.35),0 0 30px rgba(56,189,248,.3)}
.seg{display:flex;background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:4px;gap:4px;margin:14px 0}
.seg button{flex:1;font:inherit;font-size:16px;padding:10px;border:0;border-radius:10px;background:none;color:var(--m);cursor:pointer;transition:.25s}
.seg .on{background:linear-gradient(135deg,var(--a),var(--a2));color:#04121e;font-weight:700;box-shadow:0 6px 18px rgba(14,165,233,.35)}
.lb{display:block;margin:12px 0 6px;color:var(--a);font-size:14px;font-weight:600}
.aip textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--s);color:var(--t);resize:vertical;direction:rtl;text-align:right;line-height:1.8}
.aip textarea:focus,.aip select:focus{outline:2px solid var(--a2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two select{width:100%}
.dtl{margin:14px 0;border:1px solid var(--bd);border-radius:14px;padding:4px 14px;background:rgba(56,189,248,.04)}
.dtl summary{cursor:pointer;padding:10px 0;color:var(--a);font-weight:600;list-style:none}.dtl summary::-webkit-details-marker{display:none}
.dtl summary::before{content:"▸ ";transition:.2s}.dtl[open] summary::before{content:"▾ "}
.dtl[open]{padding-bottom:12px}
.mt{color:var(--m);font-size:13px;line-height:1.8;margin:6px 0}
.er{color:#fca5a5;min-height:22px;margin:8px 0 0;text-align:center;line-height:1.8}
.ail{text-align:center}
.sun{position:relative;width:110px;height:110px;margin:10px auto 18px}
.sun b{position:absolute;inset:30px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:radial-gradient(circle,#fde047,#38bdf8);box-shadow:0 0 40px rgba(253,224,71,.6);animation:fl 2s ease-in-out infinite}
.sun i{position:absolute;left:50%;top:50%;width:6px;height:46px;margin:-46px 0 0 -3px;border-radius:4px;background:linear-gradient(#fde047,transparent);transform-origin:50% 46px;animation:ray 2.4s ease-in-out infinite}
.sun i:nth-child(1){transform:rotate(0)}.sun i:nth-child(2){transform:rotate(51deg);animation-delay:.2s}.sun i:nth-child(3){transform:rotate(103deg);animation-delay:.4s}.sun i:nth-child(4){transform:rotate(154deg);animation-delay:.6s}.sun i:nth-child(5){transform:rotate(206deg);animation-delay:.8s}.sun i:nth-child(6){transform:rotate(257deg);animation-delay:1s}.sun i:nth-child(7){transform:rotate(309deg);animation-delay:1.2s}
@keyframes ray{50%{opacity:.25}}
.aires{width:min(920px,calc(100vw - 32px));position:relative;inset-inline-start:calc(50% - min(920px,calc(100vw - 32px))/2)}
.aitb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}.aitb .btn{font-size:15px;padding:10px 16px}
.deckwrap{position:relative}
.deckwrap .dx{display:none;position:absolute;top:10px;inset-inline-end:12px;z-index:5;background:rgba(0,0,0,.5);border:0;color:#fff;font-size:18px;border-radius:50%;width:38px;height:38px;cursor:pointer}
.prog{height:4px;background:var(--bd);border-radius:4px;margin:12px 0;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a2),#fde047);transition:width .4s}
.dnav{display:flex;gap:12px;align-items:center;justify-content:center;direction:ltr}
.dnav button{font:inherit;font-size:24px;width:48px;height:44px;border-radius:12px;border:1px solid var(--bd);background:rgba(56,189,248,.08);color:var(--a);cursor:pointer}
.dnav span{min-width:90px;text-align:center;color:var(--m);direction:rtl}
.notes{margin:12px auto 0;max-width:760px;padding:14px 18px;border-radius:14px;border:1px solid var(--bd);background:rgba(56,189,248,.06);line-height:1.9;color:var(--t);text-align:right}
.deckwrap.fs{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;justify-content:center;padding:0}
.deckwrap.fs .sdk{width:min(100vw,calc(100vh*16/9));margin:0 auto;border-radius:0}
.deckwrap.fs .dx{display:block}.deckwrap.fs .prog{display:none}.deckwrap.fs .dnav{position:absolute;bottom:8px;left:0;right:0;opacity:.5}.deckwrap.fs .notes{display:none}
</style>

<main id="app"></main>
<script>
(function(){
const $=s=>document.querySelector(s),app=$('#app'),back=$('#back');
const ar=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const rnd=n=>Math.floor(Math.random()*n);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
let view=0,tm,from=null;
function go(fn){view++;clearTimeout(tm);window.scrollTo(0,0);fn();back.hidden=fn===home;try{app.animate([{opacity:0},{opacity:1}],{duration:340,easing:'ease-out'})}catch(e){}}
back.onclick=()=>go(from||home);

const G=[['⚛️','خشتەی خولیی ئێلێمێنتەکان','١١٨ ئێلێمێنت لە سێ ڕەهەند',ptable],
['🔮','فاڵی ئەمڕۆ','بزانە ئەمڕۆ چی چاوەڕێتە',fortune],
['🧠','یاری بیرهێنانەوە','جووتە وێنەکان بدۆزەرەوە',memory],
['⚡','خێرایی کاردانەوە','بزانە چەند خێرایت',reaction],
['🔢','حەدسی ژمارە','ژمارەی شاراوە بدۆزەرەوە',guess],
['⭕','ئێکس و ئۆ','لەگەڵ کۆمپیوتەر یاری بکە',xo],
['📚','کویزی دەرسەکان','١٠ دەرس، پرسیار و شەرح',quiz],
['🐍','یاری مار','بخۆ و گەورە ببە',snake],
['🎯','یاری ئامانج','لە ٢٠ چرکەدا چەند دەگریت',target],
['➕','بیرکاری خێرا','٣٠ چرکە، زۆرترین وەڵام',mathgame],
['🎵','سایمۆن','ڕیزی ڕەنگەکان وەبیر بێنەوە',simon],
['🐹','مشک بکوتە','خێرا بیکوتە',mole],
['🎨','ڕەنگ نەک وشە','مێشکت تاقی بکەرەوە',stroop],
['✂️','بەرد، کاغەز، مقەست','لەگەڵ کۆمپیوتەر',rps],
['🎲','زار و پارە','بەختی خۆت تاقی بکەرەوە',dice],
['🔤','وشەی تێکچوو','پیتەکان ڕێک بخەرەوە',scram],
['🧮','بیرهێنانەوەی ژمارە','ژمارەکە وەبیر بێنەوە',nmem],
['🧩','پازڵی ژمارە','ژمارەکان ڕێک بخە',slide],
['🃏','زیاتر یان کەمتر','ژمارەی دواتر بزانە',hilo],
['💡','چراکان','هەموو چراکان بکوژێنەوە',lights],
['🖱️','خێرایی کلیک','لە ١٠ چرکەدا چەند؟',cps],
['⌨️','خێرایی نووسین','ڕستەکە بە خێرایی بنووسە',typing],
['🎈','پەلەهەوا','بیانتەقێنە',balloon],
['🔍','جیاوازەکە بدۆزەرەوە','ئیمۆجی جیاواز بدۆزەرەوە',odd],
['✅','ڕاستە یان هەڵە','هاوکێشەکە بپشکنە',tf],
['🔷','٢٠٤٨','بلۆکەکان بگونجێنە',g2048],
['🔴','چوار بە دوای یەک','لەگەڵ کۆمپیوتەر',c4],
['💣','ماین‌پشکنین','ماینەکان بدۆزەرەوە',mines],
['🧮','ژمێرەر','زانستی، گۆشەکان بە پلە',calc],
['🎓','تێکڕای نمرە','نمرە و کرێدیت',gpa],
['📏','گۆڕینی یەکە','درێژی، کێش، گەرمی...',units],
['📅','گۆڕینی بەروار','کۆچی و زایینی',dates],
['⏱️','کاتژمێری خوێندن','پۆمۆدۆرۆ',pomo],
['🗓️','خشتەی وانەکان','بۆ هەموو هەفتە',tt],
['✅','ئەرکەکان','لیستی کارەکان',todo],
['⏳','تاقیکردنەوەکان','ڕۆژی ماوە',exam],
['📖','فەرهەنگی زاراوەکان','کوردی، ئینگلیزی، عەرەبی',gloss],
['🗂️','کارتی فێربوون','زاراوە و ڕاستییەکان',cards],
['🏫','دەربارەی پەیمانگا','پەیوەندی و شوێن',about],
['✨','ڕاپۆرت و سیمینارساز','ژیری دەستکرد، دیزاینی پرۆفیشناڵ',aiDoc]];


const CM=new Map([[ptable,1],[quiz,1],[gloss,1],[cards,1],[calc,2],[gpa,2],[units,2],[dates,2],[pomo,3],[tt,3],[todo,3],[exam,3],[about,4],[aiDoc,5]]);
const cat=g=>CM.get(g[3])||0;
const CATS=[['🎮','یارییەکان','فاڵ و یاری بۆ خۆشی و تاقیکردنەوەی خێرایی و ژیری'],['📚','دەرسەکان','کویز، خشتەی خولی، فەرهەنگ و کارتی فێربوون'],['🧰','ئامرازەکان','ژمێرەر، تێکڕای نمرە، گۆڕینی یەکە و بەروار'],['⏱️','خوێندن و ڕێکخستن','کاتژمێری خوێندن، خشتەی وانە، ئەرکەکان و تاقیکردنەوە'],['🏫','دەربارەی پەیمانگا','پەیوەندی، شوێن و ڕاگەیاندنەکان'],['🤖','ژیری دەستکرد','ڕاپۆرت و سیمینار بە جوانترین دیزاین']];
function tilt(t){
  t.onpointermove=e=>{if(e.pointerType==='touch')return;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform=`perspective(700px) rotateY(${x*9}deg) rotateX(${-y*9}deg) translateY(-3px)`;t.style.setProperty('--mx',(x+.5)*100+'%');t.style.setProperty('--my',(y+.5)*100+'%')};
  t.onpointerleave=()=>{t.style.transform=''};
}
function home(){
  from=null;homeOld();
  app.querySelector('.sec span').textContent='بەشەکان';
  const gr=app.querySelector('.grid');gr.className='cats';
  gr.innerHTML=CATS.map((c,i)=>`<button class="cat c${i}" data-i="${i}"><span class="ci">${c[0]}</span><span class="ct"><b>${c[1]}</b><small>${c[2]}</small></span><em>${ar(G.filter(g=>cat(g)===i).length)}</em></button>`).join('');
  gr.querySelectorAll('.cat').forEach((b,i)=>{b.style.animationDelay=i*120+'ms';b.onclick=()=>go(()=>hub(i));tilt(b)});
}
function hub(c){
  from=null;const L=CATS[c];
  app.innerHTML=`<section class="hero hub"><div class="hi">${L[0]}</div><h1>${L[1]}</h1><p>${L[2]}</p></section><div class="grid">${G.map((g,i)=>[g,i]).filter(([g])=>cat(g)===c).map(([g,i])=>`<button class="tile" data-i="${i}"><span class="ic">${g[0]}</span><b>${g[1]}</b><small>${g[2]}</small></button>`).join('')}</div>`;
  app.querySelectorAll('.tile').forEach((t,k)=>{t.style.animationDelay=Math.min(k*40,600)+'ms';t.onclick=()=>{from=()=>hub(c);go(G[t.dataset.i][3])};tilt(t)});

/* ---------- فاڵ ---------- */
function fortune(){
  const F=[["ئەمڕۆ ڕۆژێکی باش دەبێت؛ بە بزەیەکەوە دەست پێبکە.","ڕۆژ"],
  ["شتێکی خۆش لە ڕێگایە، تەنها کەمێک ئارام بگرە.","ڕۆژ"],
  ["کەمێک پشوو بدە و چایەک بخۆرەوە؛ دواتر کارەکانت ئاسانتر دەبن.","ڕۆژ"],
  ["تۆ لەوەی گومان دەبەیت زیرەکتریت.","ڕۆژ"],
  ["ئەگەر کۆدەکەت کاری نەکرد، دڵگران مەبە؛ هەموو پرۆگرامنووسێک ئەم ڕۆژانەی بینیوە.","کۆدکردن"],
  ["ئەمڕۆ هەڵەیەک لە پرۆگرامەکەت دەدۆزیتەوە و هاوپۆلەکانت سوپاست دەکەن.","کۆدکردن"],
  ["هاوڕێیەکت بیرت دەکاتەوە، پەیوەندیی پێوە بکە.","هاوڕێیەتی"],
  ["ئەمڕۆ هاوڕێیەکی نوێ لە پۆلەکەتدا پەیدا دەکەیت.","هاوڕێیەتی"],
  ["ئەگەر ئەمڕۆ بخوێنیت، سبەینێ نمرەیەکی باشت دەبێت.","خوێندن"],
  ["مامۆستاکەت ئەمڕۆ پرسیارێکت لێ دەکات و وەڵامەکەی دەزانیت.","خوێندن"]];
  const C=[["سوور","#ef4444"],["شین","#3b82f6"],["سەوز","#22c55e"],["زەرد","#facc15"],["مۆر","#8b5cf6"],["پرتەقاڵی","#f97316"],["پەمەیی","#ec4899"]];
  const T=["نەتگرتم!","نزیک بوویت، بەڵام نەتگرتم.","خێراتر بجووڵێ!","من کۆمپیوتەرم، لە تۆ خێراترم.","تەنها یەک هەوڵی تر ماوە!"];
  const MAX=5;let count=0,last=-1,seen=0,hit=0,typ,cur='';
  app.innerHTML=`<div class="panel"><div class="ball" id="ball">🔮</div><h2>فاڵی ئەمڕۆ</h2><p class="sub" id="sub">دەتوانیت دوگمەکە بگریت؟ هەوڵ بدە!</p><div class="fo" id="fo">✨</div><div class="meta" id="meta"></div><div class="slot"><button class="btn" id="b1">فاڵەکەم پیشان بدە</button><button class="btn" id="b2" hidden>فاڵێکی تر</button><button class="btn ghost" id="b3" hidden>ناردن بۆ هاوڕێیەک</button></div><div class="muted" id="cn"></div></div>`;
  const b1=$('#b1'),b2=$('#b2'),b3=$('#b3'),fo=$('#fo'),sub=$('#sub'),cn=$('#cn'),meta=$('#meta'),ball=$('#ball');
  function dodge(e){
    if(count>=MAX)return;const n=Date.now();if(n-hit<300)return;hit=n;
    if(e.preventDefault)e.preventDefault();count++;buzz(40);
    if(count<MAX){
      b1.classList.add('run');
      const w=innerWidth-b1.offsetWidth-16,h=innerHeight-b1.offsetHeight-16;
      b1.style.left=(8+Math.random()*Math.max(w,0))+'px';b1.style.top=(8+Math.random()*Math.max(h,0))+'px';
      b1.style.transform='scale('+(1-count*.06)+')';
      sub.textContent=T[count-1];cn.textContent='هەوڵی '+ar(count)+' لە '+ar(MAX);
    }else{
      b1.classList.remove('run');b1.style.left=b1.style.top=b1.style.transform='';
      b1.textContent='ئێستا کلیکم لێ بکە';sub.textContent='باشە، تەسلیم بووم!';cn.textContent='';
    }
  }
  b1.addEventListener('pointerenter',dodge);b1.addEventListener('pointerdown',dodge);
  function pick(){
    let i;do{i=rnd(F.length)}while(i===last);last=i;cur=F[i][0];seen++;
    const c=C[rnd(C.length)],a=Array.from(cur);let k=0;fo.textContent='';clearInterval(typ);
    typ=setInterval(()=>{fo.textContent+=a[k++];if(k>=a.length)clearInterval(typ)},32);
    meta.innerHTML=`<span class="chip">بەش: ${F[i][1]}</span><span class="chip">ژمارەی بەخت: ${ar(1+rnd(99))}</span><span class="chip">ڕەنگی بەخت: ${c[0]} <span style="color:${c[1]}">●</span></span>`;
    cn.textContent='ئەمڕۆ '+ar(seen)+' فاڵت بینیوە';confetti();buzz([50,30,50]);
  }
  b1.onclick=()=>{if(count<MAX)return;b1.hidden=true;b2.hidden=b3.hidden=false;sub.textContent='ئافەرین، بردتەوە!';pick()};
  b2.onclick=pick;
  ball.onclick=()=>buzz(30);
  b3.onclick=()=>{const t='فاڵی ئەمڕۆم: '+cur+'\n'+location.href;
    try{if(navigator.share){navigator.share({text:t});return}}catch(e){}
    try{navigator.clipboard.writeText(t);b3.textContent='کۆپی کرا ✓'}catch(e){b3.textContent='کۆپی نەکرا'}};
}

/* ---------- بیرهێنانەوە ---------- */
function memory(){
  const E=['💻','🖥️','⌨️','🖱️','💾','📡','🔌','🧠'],deck=sh([...E,...E]);
  let pk=[],moves=0,found=0,lock=false;const best=st.get('mem');

    if(v===n){done=true;gm.textContent='دروستە! ژمارەکە '+ar(n)+' بوو و لە '+ar(tries)+' هەوڵدا دۆزیتەوە.';confetti();
      if(!best||tries<+best)st.set('gs',tries)}

/* ---------- ئێکس و ئۆ ---------- */
const sc={w:0,l:0,d:0};
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const win=b=>{for(const[x,y,z]of L)if(b[x]&&b[x]===b[y]&&b[x]===b[z])return b[x];return b.every(Boolean)?'d':null};
function ai(b){
  const f=p=>{for(const l of L){const v=l.map(i=>b[i]);if(v.filter(c=>c===p).length===2&&v.includes(''))return l[v.indexOf('')]}return -1};
  let m=f('O');if(m<0)m=f('X');if(m<0&&!b[4])m=4;
  if(m<0){const e=[0,2,6,8].filter(i=>!b[i]);if(e.length)m=e[rnd(e.length)]}
  if(m<0){const e=b.map((c,i)=>c?-1:i).filter(i=>i>=0);m=e[rnd(e.length)]}return m;
}
function xo(){
  const v=view;let b=Array(9).fill(''),over=false,turn=true;
  app.innerHTML=`<div class="panel"><h2>ئێکس و ئۆ</h2><p class="sub" id="xs">نۆرەی تۆیە، تۆ X ی.</p><div class="stats"><span class="chip" id="x1"></span></div><div class="xo">${b.map((_,i)=>`<button class="xc" data-i="${i}"></button>`).join('')}</div><button class="btn ghost" id="xr">یاری نوێ</button></div>`;
  const cs=app.querySelectorAll('.xc'),msg=t=>$('#xs').textContent=t;
  const tally=()=>$('#x1').textContent=`تۆ: ${ar(sc.w)} | کۆمپیوتەر: ${ar(sc.l)} | یەکسان: ${ar(sc.d)}`;tally();
  const draw=()=>cs.forEach((c,i)=>{c.textContent=b[i];c.classList.toggle('o',b[i]==='O')});
  function end(r){over=true;
    if(r==='X'){sc.w++;msg('تۆ بردتەوە!');confetti()}else if(r==='O'){sc.l++;msg('کۆمپیوتەر بردیەوە. دووبارە هەوڵ بدەوە!')}else{sc.d++;msg('یەکسان بوو.')}tally()}
  cs.forEach((c,i)=>c.onclick=()=>{
    if(over||!turn||b[i])return;b[i]='X';draw();let r=win(b);if(r)return end(r);
    turn=false;msg('کۆمپیوتەر بیر دەکاتەوە...');
    tm=setTimeout(()=>{if(v!==view)return;b[ai(b)]='O';draw();r=win(b);if(r)return end(r);turn=true;msg('نۆرەی تۆیە.')},500);
  });
  $('#xr').onclick=()=>go(xo);
}

function snake(){
  const v=view,N=15;let sn=[[7,7]],d=[1,0],nd=d,f=[3,3],sc=0;const best=+st.get('sn')||0;
  app.innerHTML=`<div class="panel"><h2>یاری مار</h2><p class="sub">بخۆ و گەورە ببە. بە دیوار و خۆت مەکەوە.</p><div class="stats"><span class="chip" id="s1">خاڵ: ٠</span><span class="chip">باشترین: ${ar(best)}</span></div><canvas class="gc" id="sc" width="300" height="300"></canvas><div class="dp"><i></i><button data-x="0" data-y="-1">▲</button><i></i><button data-x="-1" data-y="0">◀</button><button data-x="0" data-y="1">▼</button><button data-x="1" data-y="0">▶</button></div><p class="sub" id="sm"></p><button class="btn ghost" id="sr">دووبارە</button></div>`;
  const cv2=$('#sc'),c=cv2.getContext('2d');
  const dir=(x,y)=>{if(x+d[0]!==0||y+d[1]!==0)nd=[x,y]};
  app.querySelectorAll('.dp button').forEach(b=>b.onclick=()=>dir(+b.dataset.x,+b.dataset.y));
  document.onkeydown=e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m&&v===view){e.preventDefault();dir(...m)}};
  let sx,sy;cv2.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};
  cv2.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;Math.abs(dx)>Math.abs(dy)?dir(dx>0?1:-1,0):dir(0,dy>0?1:-1)};
  const has=(p,a)=>a.some(q=>q[0]===p[0]&&q[1]===p[1]);
  function draw(){c.clearRect(0,0,300,300);c.fillStyle='#fff';c.beginPath();c.arc(f[0]*20+10,f[1]*20+10,7,0,7);c.fill();
    sn.forEach((p,i)=>{c.fillStyle=i?'#38bdf8':'#bae6fd';c.fillRect(p[0]*20+1,p[1]*20+1,18,18)})}
  tm=setInterval(()=>{if(v!==view){clearInterval(tm);return}
    d=nd;const h=[sn[0][0]+d[0],sn[0][1]+d[1]];
    if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||has(h,sn)){clearInterval(tm);if(sc>best)st.set('sn',sc);$('#sm').textContent='یاری تەواو بوو. خاڵەکەت: '+ar(sc);buzz(200);return}
    sn.unshift(h);
    if(h[0]===f[0]&&h[1]===f[1]){sc++;$('#s1').textContent='خاڵ: '+ar(sc);do{f=[rnd(N),rnd(N)]}while(has(f,sn))}else sn.pop();
    draw()},130);
  draw();$('#sr').onclick=()=>go(snake);
}

function mathgame(){
  const v=view;let sc=0,t=30;const best=+st.get('mg')||0;
  app.innerHTML=`<div class="panel"><h2>بیرکاری خێرا</h2><p class="sub">٣٠ چرکەت هەیە، وەڵامی دروست هەڵبژێرە.</p><div class="stats"><span class="chip" id="q1">دروست: ٠</span><span class="chip" id="q2">کات: ٣٠</span><span class="chip">باشترین: ${ar(best)}</span></div><div id="qb"><button class="btn" id="qs">دەستپێکردن</button></div></div>`;
  function nq(){
    const a=1+rnd(12),b=1+rnd(12),op=rnd(3),r=[a+b,a-b,a*b][op],o=new Set([r]);while(o.size<4)o.add(r+rnd(11)-5);
    $('#qb').innerHTML=`<h2 style="direction:ltr;font-size:34px">${a} ${'+−×'[op]} ${b} = ?</h2><div class="grid">${sh([...o]).map(x=>`<button class="opt" data-x="${x}" style="text-align:center;direction:ltr">${x}</button>`).join('')}</div>`;
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.x===r){sc++;$('#q1').textContent='دروست: '+ar(sc);buzz(15)}else buzz(80);nq()});
  }
  $('#qs').onclick=()=>{nq();tm=setInterval(()=>{if(v!==view){clearInterval(tm);return}t--;$('#q2').textContent='کات: '+ar(t);
    if(t<=0){clearInterval(tm);if(sc>best)st.set('mg',sc);confetti();
      $('#qb').innerHTML=`<p class="sub" style="font-size:20px">کاتەکە تەواو بوو! ${ar(sc)} وەڵامی دروستت دا.</p><button class="btn ghost" id="qr">دووبارە</button>`;$('#qr').onclick=()=>go(mathgame)}},1000)};
}

function simon(){
  const v=view,C=['#38bdf8','#22c55e','#facc15','#ef4444'];let seq=[],pos=0,busy=true,sc=0;
  PN('سایمۆن','ڕیزی ڕەنگەکان وەبیر بێنەوە و دووبارەیان بکەرەوە.',ST(CH('a','خاڵ: ٠'),CH('c','باشترین: '+ar(bs('simon'))))+`<div class="xo" style="grid-template-columns:1fr 1fr;max-width:260px">${C.map(c=>`<button class="xc" style="background:${c};opacity:.45"></button>`).join('')}</div><p class="sub" id="m"></p><button class="btn" id="go">دەستپێکردن</button>`);

  const play=()=>{busy=true;pos=0;seq.push(rnd(4));set('m','سەیر بکە...');seq.forEach((s,k)=>setTimeout(()=>{if(v===view)fl(s)},600*(k+1)));setTimeout(()=>{if(v===view){busy=false;set('m','نۆرەی تۆیە')}},600*seq.length+400)};
  pd.forEach((b,i)=>b.onclick=()=>{if(busy)return;fl(i);if(i!==seq[pos]){busy=true;sv('simon',sc);set('m','هەڵە بوو! یاری تەواو بوو.');buzz(200);return}pos++;if(pos===seq.length){sc++;set('a','خاڵ: '+ar(sc));busy=true;tm=setTimeout(play,700)}});

}

  const show=k=>{i=Math.max(0,Math.min(sl.length-1,k));sl.forEach((s,j)=>s.classList.toggle('on',j===i));$('#pg').style.width=((i+1)/sl.length*100)+'%';set('dc',(rtl?ar(i+1)+' / '+ar(sl.length):(i+1)+' / '+sl.length));$('#nt').textContent=notes[i]||'';buzz(8)};
  const nx=()=>show(i+1),pv=()=>show(i-1);
  $('#dn2').onclick=nx;$('#dn1').onclick=pv;$('#dnt').onclick=()=>{const n=$('#nt');n.hidden=!n.hidden};
  $('#bp').onclick=()=>{dw.classList.add('fs');try{dw.requestFullscreen&&dw.requestFullscreen()}catch(e){}};
  const ex=()=>{dw.classList.remove('fs');try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}};$('#dxb').onclick=ex;
  document.onkeydown=e=>{if(v!==view)return;const k=e.key;if(k==='Escape')ex();else if(k==='ArrowLeft')rtl?nx():pv();else if(k==='ArrowRight')rtl?pv():nx();else if(k===' '||k==='PageDown')nx();else if(k==='PageUp')pv()};
  let sx=0;const sk=dw.querySelector('.sdk');sk.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
  sk.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)((dx<0)===rtl)?nx():pv()});
  sk.addEventListener('click',e=>{if(!dw.classList.contains('fs'))return;const r=sk.getBoundingClientRect();((e.clientX<r.left+r.width/2)===rtl)?nx():pv()});
  show(0);
}

/* ---------- confetti ---------- */
const cv=$('#cv'),cx=cv.getContext('2d');let P=[],on=false;
const fit=()=>{cv.width=innerWidth;cv.height=innerHeight};fit();addEventListener('resize',fit);
function confetti(){
  const col=['#7dd3fc','#38bdf8','#ffffff','#0ea5e9','#bae6fd'];
  for(let i=0;i<100;i++)P.push({x:cv.width/2,y:cv.height*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:4+Math.random()*5,c:col[i%5],a:Math.random()*6,l:100+Math.random()*60});
  if(!on){on=true;requestAnimationFrame(tick)}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.a+=.2;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);cx.fillRect(-p.r,-p.r/2,p.r*2,p.r);cx.restore()});
  if(P.length)requestAnimationFrame(tick);else{on=false;cx.clearRect(0,0,cv.width,cv.height)}
}

/* ---------- ئەنیمەیشنی گشتی ---------- */
(function(){
  const im=document.querySelector('.brand img'),sp=document.getElementById('spl');if(im&&sp)sp.src=im.src;
  const sl=document.getElementById('splash');if(sl)sl.addEventListener('animationend',e=>{if(e.animationName==='spf')sl.remove()});
  const hd=document.querySelector('header');addEventListener('scroll',()=>hd.classList.toggle('sc',scrollY>8),{passive:true});
  document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('.btn,.opt,.tile,.cat');if(!b)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement('span');s.className='rp';
    s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),620)});
  const c=document.getElementById('bgc');if(!c||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const x=c.getContext('2d');let w,h,P=[];
  const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;P=Array.from({length:Math.min(60,Math.floor(w*h/20000))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.6+.4}))};
  rs();addEventListener('resize',rs);
  const f=()=>{if(!document.hidden){x.clearRect(0,0,w,h);
    P.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;x.fillStyle='rgba(125,211,252,.55)';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();
      for(let j=i+1;j<P.length;j++){const q=P[j],d=Math.hypot(p.x-q.x,p.y-q.y);if(d<130){x.strokeStyle=`rgba(56,189,248,${.17*(1-d/130)})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}})}
    requestAnimationFrame(f)};f();
})();
home();
})();
